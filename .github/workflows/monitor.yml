name: Live site check

# Daily: the public pages answer, load their styles and share cards.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl
          coverage: none
      - run: php deploy/smoke-test.php https://sunset.erwanbargain.com
