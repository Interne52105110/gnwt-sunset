; Project-local PHP settings for the gnwt-sunset demo (used through PHPRC, system php.ini untouched).
extension_dir = "C:/php/ext"
extension=curl
extension=mbstring
extension=openssl
extension=fileinfo
extension=gd
extension=intl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip
zend_extension=opcache
memory_limit = 1024M
max_execution_time = 0
date.timezone = America/Yellowknife
opcache.enable_cli = 0
realpath_cache_size = 4096K
; Trusted root certificates for outbound HTTPS (PHP on Windows ships none).
; Uses the Mozilla bundle that comes with Git for Windows; adjust the path if needed.
curl.cainfo = "C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"
openssl.cafile = "C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"
