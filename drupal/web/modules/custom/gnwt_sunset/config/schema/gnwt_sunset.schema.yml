gnwt_sunset.settings:
  type: config_object
  label: 'GNWT sunset toolkit settings'
  mapping:
    legacy_hosts:
      type: sequence
      label: 'Legacy hosts answered with redirects'
      sequence:
        type: string
        label: 'Host'
    target_hosts:
      type: sequence
      label: 'New site hosts and their language'
      sequence:
        type: mapping
        label: 'Target host'
        mapping:
          host:
            type: string
            label: 'Host'
          langcode:
            type: string
            label: 'Language code'
    fallback:
      type: mapping
      label: 'Fallback URL pattern per language'
      mapping:
        en:
          type: string
          label: 'English'
        fr:
          type: string
          label: 'French'
    home:
      type: mapping
      label: 'Home page per language'
      mapping:
        en:
          type: string
          label: 'English'
        fr:
          type: string
          label: 'French'
    user_agent:
      type: string
      label: 'User agent'
    min_delay:
      type: float
      label: 'Minimum delay between two requests to the same host, in seconds'
    max_consecutive_errors:
      type: integer
      label: 'Server errors in a row before a host is skipped'
    suggest_threshold:
      type: float
      label: 'Minimum score to suggest a target'
    high_threshold:
      type: float
      label: 'Score above which a suggestion is high confidence'
    serve_high_confidence:
      type: boolean
      label: 'Serve unreviewed high-confidence suggestions (302)'

action.configuration.gnwt_sunset_approve:
  type: action_configuration_default
  label: 'Approve the suggested page configuration'

action.configuration.gnwt_sunset_gone:
  type: action_configuration_default
  label: 'Mark as having no equivalent configuration'

action.configuration.gnwt_sunset_reset:
  type: action_configuration_default
  label: 'Send back to review configuration'

field.formatter.settings.gnwt_sunset_compact_url:
  type: mapping
  label: 'Compact link formatter settings'
  mapping:
    strip:
      type: string
      label: 'Part of the URL to hide: scheme or host'

field.formatter.settings.gnwt_sunset_confidence:
  type: mapping
  label: 'Confidence bar formatter settings'

field.formatter.settings.gnwt_sunset_badge:
  type: mapping
  label: 'Badge formatter settings'
